name: Tests

# Runs the release tests on every pull request and push to main, so problems
# show up before anyone starts a release.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the app's modules
        run: |
          (cd tools && npm ci --silent || npm install --silent)
          node scripts/check-app.mjs
      - name: The app in web/ matches its modules
        run: |
          cp web/index.html /tmp/committed.html
          sh scripts/sync-web.sh
          if ! cmp -s web/index.html /tmp/committed.html; then
            echo "::error::web/index.html is out of date: run scripts/sync-web.sh and commit it"; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Run the release tests
        run: python tests/smoke.py
