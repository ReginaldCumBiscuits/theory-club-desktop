name: Tests

# Runs the release tests on every pull request and push to main, so problems
# show up before anyone starts a release.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium
      - name: Run the release tests
        run: python tests/smoke.py
