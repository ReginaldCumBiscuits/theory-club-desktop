name: Android

# Builds the Android app (an APK you install directly).
# Run by hand to test, or from the release workflow with a version to attach it to that release.
on:
  workflow_dispatch:
  push:
    branches: [v51-android]   # testing the Android build; removed before merging
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK parts (the build machine already has the SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tauri CLI (installed in the project, so the Android build can call it back)
        run: |
          [ -f package.json ] || echo '{"name":"theory-club-build","private":true,"scripts":{"tauri":"tauri"}}' > package.json
          npm install --no-save @tauri-apps/cli@2

      - name: Stamp version
        if: inputs.version != ''
        run: node scripts/prepare-release.mjs "$VERSION" "${{ github.repository }}"

      - name: Faster start on phones (the app's code in its own file)
        run: node scripts/split-scripts.mjs web

      - name: Create the Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ]; then
            echo "$KS" | base64 -d > src-tauri/gen/android/theory-club.jks
            printf 'storeFile=theory-club.jks\nkeyAlias=theoryclub\npassword=%s\n' "$KSP" > src-tauri/gen/android/keystore.properties
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE secret, so the APK is unsigned (it builds, but can't be installed)."
          fi
          node scripts/android-setup.mjs

      - name: Build the app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npm run tauri -- android build --apk --target aarch64 armv7 --ci

      - name: Collect the APK
        run: |
          mkdir dist
          A=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "built $A"
          if [ "${SIGNED:-}" = "1" ]; then cp "$A" dist/theory-club-android.apk; else cp "$A" dist/theory-club-android-unsigned.apk; fi
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: theory-club-android
          path: dist/*.apk

      - name: Add to the release
        if: inputs.version != '' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/theory-club-android.apk --clobber --repo "${{ github.repository }}"
